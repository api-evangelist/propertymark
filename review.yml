conclusion: >-
  Propertymark is the study's cleanest example of an industry body with genuinely NO API surface,
  and it is valuable precisely because the negatives are trustworthy: the site returns honest 404s
  rather than WAF challenges, so every absence recorded here is a measurement rather than a guess.
  Certification and reachability are held apart here in an unusual way - Propertymark certifies
  agents rather than data, publishes its certification criteria as a free anonymous PDF download,
  and exposes the resulting certification directory only through an undocumented CMS endpoint that
  it has never held out as an API. RESO is absent, not unreachable: no Web API certification, no
  Data Dictionary version, no $metadata, no UPI, no directory listing, and zero site-search hits
  for either "RESO" or "OData", because the United Kingdom has no MLS for RESO to standardise. The
  one thread back to the RESO world is financial rather than technical - NAR's Second Century
  Ventures backs Propertymark's Connect referral platform through REACH, while NAR's standards arm
  has no presence in this market at all. A developer wanting UK property data must go to HM Land
  Registry and Ordnance Survey; a developer wanting Propertymark data has nothing published to
  sign, apply for, or join.
