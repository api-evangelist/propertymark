harvestedArtifacts:
  directory: none
  fetchedOn: '2026-07-26'
  count: 0
  reason: >-
    No machine-readable contract of any kind was found to harvest. There is no OpenAPI document,
    no AsyncAPI document, no OData $metadata, no JSON Schema, no XSD, no Postman collection and no
    OIDC discovery document on any resolving Propertymark host. The openapi/ directory is
    therefore deliberately omitted rather than filled with anything derived or invented.
  notHarvested:
    - what: Propertymark Conduct and Membership Rules PDF
      reason: >-
        Real and freely downloadable (HTTP 200, 672,154 bytes) but a 37-page PDF, not a
        machine-readable contract. Linked from apis.yml common[] instead of stored.
    - what: Find an Expert member directory JSON (193,017 bytes, 200 records)
      reason: >-
        A real anonymous HTTP 200 response, but the output of an undocumented Preside CMS page
        handler with no contract, no terms and no versioning. Storing it would present an
        implementation detail as a published artifact. Its shape is recorded in
        surfaces.undocumentedInternalSurface instead.
    - what: Learner portal Nhost/Hasura GraphQL schema
      reason: >-
        Private application backend; every anonymous probe returned HTTP 403 "Missing
        Authentication Token". No introspection was attempted and no credentials were used.
    - what: Property Data Trust Framework schemas
      reason: >-
        Real and open, but they belong to the Open Property Data Association, a separate body.
        Attributing them to Propertymark would be false.

