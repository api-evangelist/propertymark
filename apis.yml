name: Propertymark
kind: company
description: >-
  Propertymark is the United Kingdom's largest professional body for property agents, formed in
  2017 from the merger of the National Association of Estate Agents (NAEA), the Association of
  Residential Letting Agents (ARLA), the Institute of Commercial and Business Agents (ICBA) and
  the National Association of Valuers and Auctioneers (NAVA), and representing "over 19,000
  members" across residential sales, lettings, commercial property, inventories, auctions and
  valuation. Its home market is the United Kingdom - England, Scotland, Wales, Northern Ireland
  and the Channel Islands. In the property value chain it sits on the agent-accreditation and
  consumer-protection side, not the listings side: it publishes the Conduct and Membership Rules,
  operates a government-approved Client Money Protection scheme, runs Propertymark Qualifications
  as the sector's specialist awarding organisation, and lobbies government on estate and letting
  agency regulation. Its API posture is the flat, honest zero. There is no developer portal, no
  documented API, no SDK, no webhooks and no published machine-readable contract of any kind:
  developer.propertymark.co.uk, developers.propertymark.co.uk, api.propertymark.co.uk,
  data.propertymark.co.uk and standards.propertymark.co.uk all fail DNS resolution, and
  /openapi.json, /swagger.json, /api-docs, /api, /developers, /docs, /$metadata and /odata all
  return honest HTTP 404s from www.propertymark.co.uk. RESO is entirely absent - the site's own
  search returns "result: 0 of 0" for both "RESO" and "OData" - because the United Kingdom has no
  MLS and therefore no listing-data certification layer to be certified against; UK residential
  listings reach consumers through the Rightmove/Zoopla portal duopoly via agency CRM software,
  several of whose vendors (Reapit, Street, MRI Software, Dezrez, AgentOS, Coadjute, and Rightmove
  itself) appear in Propertymark's own Industry Supplier directory. What Propertymark does publish
  freely is its rulebook: the Propertymark Conduct and Membership Rules PDF downloads anonymously
  with no login and no EULA. Its only machine-readable surface is undocumented - an internal
  Preside CMS JSON endpoint behind the public Find an Expert member directory - and its member
  area is SAML-gated, returning HTTP 401. Genuinely open UK property data comes from HM Land
  Registry and Ordnance Survey, not from the agents' professional body.
